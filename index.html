<style>
  :root {
    /* Qream brand palette (theqream.com) */
    --bg: #070312;
    --cyan: #9bff00;   /* primary accent: Qream lime */
    --blue: #671dff;   /* secondary: Qream violet */
    --gold: #c6ff4d;   /* big-moment highlight: hot lime */
    --text: #edf2e8;
    --muted: #9a93ad;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }
  #scroll-space { position: relative; width: 100%; }
  #canvas-wrap { position: fixed; inset: 0; z-index: 0; }
  canvas { display: block; }

  /* ---------- Header ---------- */
  #brand {
    position: fixed; top: 28px; left: 36px; z-index: 20;
    font-family: 'Sora', sans-serif; font-size: 13px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--muted);
    user-select: none;
  }
  #brand b { color: var(--text); font-weight: 600; }

  /* ---------- Hero ---------- */
  #hero {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #hero h1 {
    font-family: 'Sora', sans-serif; font-weight: 700;
    font-size: clamp(38px, 6vw, 72px); line-height: 1.05;
    color: var(--cyan);
    max-width: 900px;
  }
  #hero .sub {
    margin-top: 24px; font-size: clamp(15px, 1.6vw, 19px); font-weight: 300;
    color: var(--muted); max-width: 560px; line-height: 1.6;
  }
  /* ---------- Finale closing title ---------- */
  #finale {
    position: fixed; left: 50%; top: 9vh; transform: translateX(-50%);
    z-index: 15; text-align: center; pointer-events: none; opacity: 0;
    width: max-content; max-width: 90vw;
  }
  #finale .line1 {
    font-family: 'Sora', sans-serif; font-weight: 700;
    font-size: clamp(22px, 2.6vw, 34px); color: #16102c;
  }
  #finale .line2 {
    margin-top: 10px; font-size: 11.5px; letter-spacing: 0.24em;
    text-transform: uppercase; color: #5a5470;
  }

  #hero .hint {
    position: absolute; bottom: 52px; font-size: 12px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--muted);
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); opacity: .55; } 50% { transform: translateY(8px); opacity: 1; } }

  /* ---------- Milestone cards ---------- */
  #cards { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .card {
    position: absolute; left: 0; top: 0;
    width: 470px;
    opacity: 0; pointer-events: none;
    will-change: transform, opacity;
    background: rgba(6, 3, 16, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 18px;
    padding: 26px 28px;
    box-shadow: 0 14px 50px rgba(0, 0, 0, 0.45);
  }

  .card .phase {
    display: inline-block; font-family: 'Sora', sans-serif;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--bg); background: var(--accent, var(--cyan));
    padding: 5px 12px; border-radius: 999px; font-weight: 600; margin-bottom: 14px;
  }
  .card .months {
    font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent, var(--cyan)); margin-bottom: 10px; font-weight: 500;
  }
  .card h2 {
    font-family: 'Sora', sans-serif; font-weight: 700;
    font-size: clamp(30px, 3.6vw, 46px); line-height: 1.08; margin-bottom: 14px;
    text-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  .card .goal {
    font-size: 16.5px; font-weight: 300; color: #cfd8c8; line-height: 1.55; margin-bottom: 4px;
    max-width: 420px;
  }
  .card .gets { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
  .card .chip {
    font-family: 'Sora', sans-serif; font-size: 12.5px; font-weight: 600;
    color: var(--accent, var(--cyan));
    border: 1px solid color-mix(in srgb, var(--accent, var(--cyan)) 55%, transparent);
    background: color-mix(in srgb, var(--accent, var(--cyan)) 10%, transparent);
    box-shadow: 0 0 16px color-mix(in srgb, var(--accent, var(--cyan)) 22%, transparent);
    padding: 7px 13px; border-radius: 999px; white-space: nowrap;
  }
  .card .demo {
    margin-top: 18px; font-size: 13.5px; font-style: italic;
    color: var(--accent, var(--cyan)); opacity: 0.9; letter-spacing: 0.01em;
  }

  .card .qa { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px; }
  .card .qa-title {
    font-family: 'Sora', sans-serif; font-size: 10.5px; letter-spacing: 0.26em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 9px;
  }
  .card details { margin-bottom: 6px; }
  .card summary {
    cursor: pointer; list-style: none; position: relative;
    font-size: 13.5px; color: #dde5d6; line-height: 1.4;
    padding: 8px 12px 8px 32px; border-radius: 9px;
    background: rgba(255,255,255,0.05); transition: background 0.2s ease;
  }
  .card summary::-webkit-details-marker { display: none; }
  .card summary::before {
    content: '?'; position: absolute; left: 12px; top: 8px;
    color: var(--accent, var(--cyan)); font-weight: 700; font-family: 'Sora', sans-serif;
  }
  .card summary:hover { background: rgba(255,255,255,0.1); }
  .card details p {
    font-size: 13px; color: #b7c0ad; line-height: 1.55;
    padding: 9px 12px 4px 32px;
  }
  .card.big-moment .qa { max-width: 440px; margin: 20px auto 0; text-align: left; }

  .card.big-moment { text-align: center; width: 640px; }
  .card.big-moment h2 {
    font-size: clamp(40px, 6vw, 64px);
    background: linear-gradient(120deg, #fff 20%, var(--accent, var(--gold)) 80%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card.big-moment .goal { font-size: 18px; margin: 0 auto; }
  .card.big-moment .gets { justify-content: center; margin-top: 22px; }

  /* ---------- Timeline bar ---------- */
  #timeline .flag:last-child::after { transform: translateX(-92%); }
  #timeline {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 20; width: min(720px, 82vw);
    padding: 16px 22px 12px;
    background: rgba(5, 2, 14, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    opacity: 0; transition: opacity 0.6s ease;
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #timeline.visible { opacity: 1; }
  #timeline .tl-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 30px; pointer-events: none;
  }
  #timeline .tl-head .mo {
    font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.28em; text-transform: uppercase; color: var(--cyan);
  }
  #timeline .tl-head .ph {
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted);
  }
  #timeline .track {
    position: relative; height: 3px; border-radius: 999px;
    background: rgba(255,255,255,0.1);
  }
  #timeline .fill {
    position: absolute; left: 0; top: 0; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--cyan), var(--blue), #ef3a5b);
    box-shadow: 0 0 12px rgba(155,255,0,0.55);
    width: 0%;
  }
  #tl-knob {
    position: absolute; top: 50%; left: 0%;
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px var(--cyan), 0 0 4px rgba(255,255,255,0.9);
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: width 0.15s ease, height 0.15s ease;
  }
  #timeline:hover #tl-knob { width: 16px; height: 16px; }
  #tl-tip {
    position: absolute; bottom: 14px; left: 0;
    transform: translateX(-50%);
    font-family: 'Sora', sans-serif; font-size: 10px; letter-spacing: 0.15em;
    color: var(--text); background: rgba(5,2,14,0.92);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 6px;
    padding: 3px 8px; opacity: 0; transition: opacity 0.15s ease;
    pointer-events: none; white-space: nowrap;
  }
  #timeline .months {
    display: flex; justify-content: space-between; margin-top: 9px;
    font-size: 10px; letter-spacing: 0.14em; color: var(--muted);
    font-family: 'Sora', sans-serif;
  }
  #timeline .flag {
    position: absolute; top: -7px; width: 1px; height: 17px;
    background: rgba(255,255,255,0.35);
  }
  #timeline .flag::after {
    content: attr(data-label); position: absolute; bottom: 21px; left: 50%;
    transform: translateX(-50%); white-space: nowrap;
    font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  }

  /* ---------- White exit: leaving the wormhole ---------- */
  #brand, #timeline .months, #timeline .flag::after,
  .card h2, .card .goal, .card .demo, .card .chip { transition: color 0.6s ease; }
  body.white-out #brand, body.white-out #brand b { color: #1a1033; }
  body.white-out .card h2 { color: #16102c; text-shadow: none; }
  body.white-out .card.big-moment h2 {
    background: linear-gradient(120deg, #16102c 20%, #4800da 80%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  body.white-out .card .phase { color: #f2f5ec; background: #1a1033; }
  body.white-out .card .months { color: #3d8a00; }
  body.white-out .card .goal { color: #3a3550; }
  body.white-out .card .chip {
    color: #2d6e00; border-color: rgba(61,138,0,0.45);
    background: rgba(155,255,0,0.16); box-shadow: none;
  }
  body.white-out .card .demo { color: #4800da; }
  body.white-out .card {
    background: rgba(255, 255, 255, 0.78);
    border-color: rgba(0, 0, 0, 0.08);
    box-shadow: 0 14px 50px rgba(20, 10, 60, 0.12);
  }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif; letter-spacing: 0.35em; text-transform: uppercase;
    font-size: 12px; color: var(--muted);
    transition: opacity 0.7s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }

  @media (max-width: 760px) {
    #timeline { display: none; }

    #brand { left: 20px; top: 20px; }
  }
</style>
</head>

function stopProgress(i) { return (i + 0.6) / (N + 0.4); }
let navUntil = 0; // programmatic smooth-scrolls are exempt from the backlog discard
function scrollToStop(i) {
  navUntil = performance.now() + 2500;
  const max = document.documentElement.scrollHeight - innerHeight;
  window.scrollTo({ top: stopProgress(i) * max, behavior: 'smooth' });
}
addEventListener('keydown', (e) => {
  const cur = activeStop();
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault(); scrollToStop(Math.min(N - 1, cur + 1));
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault(); scrollToStop(Math.max(0, cur - 1));
  }
});

const SPACING = 64;
const pathPoints = [];
for (let i = 0; i < N; i++) {
  // one long, sweeping S across the whole journey + gentle vertical swells —
  // low-frequency arcs instead of switchbacks, so the ride never rocks you
  const f = i / (N - 1);
  pathPoints.push(new THREE.Vector3(
    Math.sin(f * Math.PI * 1.6) * 26,
    Math.sin(f * Math.PI * 2.2) * 2.5,
    -i * SPACING

function makeParticles(count, spread, size, color, opacity) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = (Math.random() - 0.5) * spread;
    pos[i * 3 + 1] = Math.random() * 70 - 10;
    pos[i * 3 + 2] = -Math.random() * (N * SPACING + 120) + 60;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    color, size, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });
  const p = new THREE.Points(g, m);
  scene.add(p);
  return p;
}

/* ---------- Sprite labels (canvas-textured) ---------- */
function makeLabel(text, hex, fontPx = 58) {
  const c = document.createElement('canvas');
  const probe = c.getContext('2d');
  probe.font = `600 ${fontPx}px Sora, sans-serif`;
  c.width = Math.max(300, Math.ceil(probe.measureText(text).width) + 140);
  c.height = fontPx + 100;
  const ctx = c.getContext('2d');
  ctx.font = `600 ${fontPx}px Sora, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = hex; ctx.shadowBlur = 26;
  ctx.fillStyle = '#eaf4ff';
  ctx.fillText(text, c.width / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false,
  }));
  sp.scale.set(c.width / 55, c.height / 55, 1);
  return sp;
}

  return new THREE.MeshStandardMaterial({

  // Finale: ONLY the giant Vermeiren coin — the prize at the end of the road
  complete(g, hex) {
    g.userData.spin = [];

    // a minted coin: lit faces with a faint self-glow (joins the ignition system),
    // metallic navy edge + raised rim ridges — the logo's own dark blue
    const NAVY = 0x1e3282;
    const faceMat = new THREE.MeshStandardMaterial({
      emissive: 0xffffff, emissiveIntensity: 0.45,
      metalness: 0.12, roughness: 0.45, // high metalness mutes the albedo — keep the logo colours juicy
      envMap: ENV_TEX, envMapIntensity: 0, // reflections fade in with the gilding
    });
    // the logo is minted, not printed: blur the artwork into a heightfield and
    // derive a normal map, so the bright shapes stand as beveled relief under
    // the shine light. The 90°-off cap UVs are baked into the canvases here —
    // texture.rotation must NOT be used: it spins UVs but not tangent space,
    // which would skew the relief lighting.
    const img = new Image();
    img.onload = () => {
      const S = 512;
      const upright = document.createElement('canvas');
      upright.width = upright.height = S;
      const ux = upright.getContext('2d', { willReadFrequently: true });
      ux.translate(S / 2, S / 2); ux.rotate(-Math.PI / 2); // canvas rotate is CW (y-down) — opposite of texture.rotation
      ux.drawImage(img, -S / 2, -S / 2, S, S);

      const d = ux.getImageData(0, 0, S, S).data;
      let h = new Float32Array(S * S);
      for (let i = 0; i < S * S; i++) {
        const j = i * 4;
        h[i] = (d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114) / 255 * (d[j + 3] / 255);
      }
      const hRaw = Float32Array.from(h); // crisp luminance, kept for the gold-state maps
      const R = 3; // bevel width in px
      const blur = (src) => {
        const out = new Float32Array(S * S);
        for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
          let s = 0, n = 0;
          for (let dy = -R; dy <= R; dy++) {
            const yy = y + dy; if (yy < 0 || yy >= S) continue;
            for (let dx = -R; dx <= R; dx++) {
              const xx = x + dx; if (xx < 0 || xx >= S) continue;
              s += src[yy * S + xx]; n++;
            }
          }
          out[y * S + x] = s / n;
        }
        return out;
      };
      h = blur(blur(h));

      const nCanvas = document.createElement('canvas');
      nCanvas.width = nCanvas.height = S;
      const nx2d = nCanvas.getContext('2d');
      const nd = nx2d.createImageData(S, S);
      const K = 5; // relief strength
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const l = h[y * S + Math.max(0, x - 1)], r = h[y * S + Math.min(S - 1, x + 1)];
        const u = h[Math.max(0, y - 1) * S + x], b = h[Math.min(S - 1, y + 1) * S + x];
        let nx = (l - r) * K, ny = (b - u) * K, nz = 1;
        const len = Math.hypot(nx, ny, nz); nx /= len; ny /= len; nz /= len;
        const j = (y * S + x) * 4;
        nd.data[j] = (nx * 0.5 + 0.5) * 255;
        nd.data[j + 1] = (ny * 0.5 + 0.5) * 255;
        nd.data[j + 2] = (nz * 0.5 + 0.5) * 255;
        nd.data[j + 3] = 255;
      }
      nx2d.putImageData(nd, 0, 0);

      // gold-state map: ALL raised artwork gilds (the logo's blue elements would
      // otherwise multiply against the gold tint and read black), field = bronze
      const gCanvas = document.createElement('canvas');
      gCanvas.width = gCanvas.height = S;
      const gx2d = gCanvas.getContext('2d');
      const gd = gx2d.createImageData(S, S);
      for (let i = 0; i < S * S; i++) {
        const t = Math.min(1, Math.max(0, (hRaw[i] - 0.25) / 0.15)); // raised vs field, soft edge
        const j = i * 4;
        // the whole medal is gold — the recessed field is just a deeper shade
        // (a dark field at metalness 1 reflects nothing and collapses to black)
        gd.data[j] = (0.52 + (1.0 - 0.52) * t) * 255;
        gd.data[j + 1] = (0.35 + (0.82 - 0.35) * t) * 255;
        gd.data[j + 2] = (0.12 + (0.4 - 0.12) * t) * 255;
        gd.data[j + 3] = 255;
      }
      gx2d.putImageData(gd, 0, 0);

      const colorTex = new THREE.CanvasTexture(upright);
      colorTex.colorSpace = THREE.SRGBColorSpace;
      colorTex.anisotropy = 8;
      const goldTex = new THREE.CanvasTexture(gCanvas);
      goldTex.colorSpace = THREE.SRGBColorSpace;
      goldTex.anisotropy = 8;
      const normalTex = new THREE.CanvasTexture(nCanvas);
      normalTex.anisotropy = 8;
      faceMat.map = colorTex;
      faceMat.emissiveMap = colorTex;
      faceMat.normalMap = normalTex;
      faceMat.needsUpdate = true;
      g.userData.coinNavyTex = colorTex;
      g.userData.coinGoldTex = goldTex;
    };
    img.src = VERMEIREN_LOGO;
    const edgeMat = new THREE.MeshStandardMaterial({
      color: NAVY, metalness: 0.85, roughness: 0.3,
      envMap: ENV_TEX, envMapIntensity: 0,
    });
    const coinGeo = new THREE.CylinderGeometry(10, 10, 2, 96);
    coinGeo.rotateX(Math.PI / 2); // faces point along the track
    const coin = new THREE.Group();
    coin.add(new THREE.Mesh(coinGeo, [edgeMat, faceMat, faceMat]));
    g.userData.coinFace = faceMat; g.userData.coinEdge = edgeMat; // gilded at the finale
    [-0.95, 0.95].forEach((z) => {
      const ridge = new THREE.Mesh(new THREE.TorusGeometry(9.6, 0.55, 14, 96), edgeMat);
      ridge.position.z = z;
      coin.add(ridge);
    });
    coin.position.set(0, 6.5, 46); // far enough that the end-hold frames it at ~half viewport
    g.add(coin); g.userData.coin = coin; // not in .spin — it settles face-on at the end
    // off-axis shine so the metal catches a moving highlight as the coin turns
    const shine = new THREE.PointLight(0xffffff, 140, 80, 2);
    shine.position.set(8, 13, 16);
    g.add(shine);
    // soft contact shadow pool that grounds the medal in the white void
    const shCanvas = document.createElement('canvas');
    shCanvas.width = shCanvas.height = 256;
    const shx = shCanvas.getContext('2d');
    const shGrad = shx.createRadialGradient(128, 128, 0, 128, 128, 128);
    shGrad.addColorStop(0, 'rgba(16, 14, 40, 0.55)');
    shGrad.addColorStop(0.55, 'rgba(16, 14, 40, 0.18)');
    shGrad.addColorStop(1, 'rgba(16, 14, 40, 0)');
    shx.fillStyle = shGrad;
    shx.fillRect(0, 0, 256, 256);
    // a true ground disc foreshortens to a sliver at this camera height, so the
    // shadow is a camera-facing soft ellipse tucked below-behind the medal
    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(11.5, 48),
      new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(shCanvas), transparent: true, opacity: 0,
        depthWrite: false, side: THREE.DoubleSide,
      })
    );
    shadow.position.set(0, -4.6, 49.5);
    shadow.scale.set(1.35, 0.5, 1);
    g.add(shadow); g.userData.coinShadow = shadow;

    // iridescent halo: a slowly turning conic ring of brand colours behind the
    // medal — normal blending, so it reads on the white (additive would vanish)
    const auCanvas = document.createElement('canvas');
    auCanvas.width = auCanvas.height = 512;
    const aux = auCanvas.getContext('2d');
    if (aux.createConicGradient) {
      const cg = aux.createConicGradient(0, 256, 256);
      [[0, '#c6ff4d'], [0.2, '#9bff00'], [0.38, '#7c3aff'], [0.56, '#671dff'], [0.76, '#ef3a5b'], [1, '#c6ff4d']]
        .forEach(([st, cc]) => cg.addColorStop(st, cc));
      aux.fillStyle = cg;
    } else {
      aux.fillStyle = '#7c3aff'; // old-browser fallback: single-colour ring
    }
    aux.fillRect(0, 0, 512, 512);
    aux.globalCompositeOperation = 'destination-in';
    const ringMask = aux.createRadialGradient(256, 256, 0, 256, 256, 256);
    ringMask.addColorStop(0.42, 'rgba(0,0,0,0)');
    ringMask.addColorStop(0.58, 'rgba(0,0,0,0.85)');
    ringMask.addColorStop(0.78, 'rgba(0,0,0,0.3)');
    ringMask.addColorStop(1, 'rgba(0,0,0,0)');
    aux.fillStyle = ringMask;
    aux.fillRect(0, 0, 512, 512);
    const auraTex = new THREE.CanvasTexture(auCanvas);
    auraTex.colorSpace = THREE.SRGBColorSpace;
    const aura = new THREE.Sprite(new THREE.SpriteMaterial({
      map: auraTex, transparent: true, opacity: 0, depthWrite: false,
    }));
    aura.position.set(0, 6.5, 48.6);
    aura.scale.setScalar(36);
    g.add(aura); g.userData.coinAura = aura;

  },
};

/* ---------- Instantiate stations along the curve ---------- */
const stations = [];
STOPS.forEach((s, i) => {
  const t = (i + 1) / (N + 1); // skip the lead-in segment
  const pos = curve.getPointAt(t);
  const group = new THREE.Group();
  // gates sit ON the track — the camera flies straight through each one
  group.position.copy(pos);
  const tan = curve.getTangentAt(t);
  group.rotation.y = Math.atan2(tan.x, tan.z);
  scene.add(group);

  builders[s.id](group, s.accent);

  // label sprite above the gate
  const hex = '#' + s.accent.toString(16).padStart(6, '0');
  const label = makeLabel(s.label, hex);
  label.position.set(0, 16.4, 0);
  group.add(label);

  // point light so the gate lights its surroundings
  const pl = new THREE.PointLight(s.accent, 60, 46, 2);
  pl.position.set(0, 5.2, 0);
  group.add(pl);

  // figures stand fully built; record each glowing material's true colour
  // so it can sleep in the road's violet and ignite on approach
  const mats = [];
  group.traverse((o) => {
    if (o === label) return;
    if (o.isMesh && o.material) {
      const list = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of list) {
        if (m.emissive !== undefined && (m.emissive.r + m.emissive.g + m.emissive.b) > 0.001) {
          mats.push({ kind: 'emissive', mat: m, orig: m.emissive.clone(), origI: m.emissiveIntensity });
        } else if (m.isMeshBasicMaterial && m.color) {
          mats.push({ kind: 'basic', mat: m, orig: m.color.clone() });
        }
      }
    } else if (o.isSprite && o.material) {
      mats.push({ kind: 'sprite', mat: o.material, orig: new THREE.Color(0xffffff) });
    }
  });
  stations.push({ group, mats, label, light: pl, t, reveal: 0, stop: s });
});

/* ---------- Cards live IN the scene: tiny on approach, full-size at the
   hold point just past the gate, then you drive by them like billboards ---------- */
const CARD_AFTER = 0.02; // card floats this far down the track past its gate
const cards3d = [];
STOPS.forEach((s, i) => {
  if (i === N - 1) return; // the finale has no card — the coin is the statement
  const tCard = (i + 1) / (N + 1) + CARD_AFTER;
  const cpos = curve.getPointAt(tCard);
  cpos.y += 5.2; // dead-center on the track, at camera height
  cards3d.push({ el: cardEls[i], worldPos: cpos, tCard });
});

/* ---------- GO LIVE barrier: a particle membrane sealing the tunnel at the
   card — a grid of glowing motes you burst through (reversible on back-scroll) ---------- */
const GOLIVE_T = (STOPS.findIndex(s => s.id === 'golive') + 1) / (N + 1) + CARD_AFTER;
const barrier = (() => {
  const group = new THREE.Group();
  group.position.copy(curve.getPointAt(GOLIVE_T));
  const tan = curve.getTangentAt(GOLIVE_T);
  group.rotation.y = Math.atan2(tan.x, tan.z);
  scene.add(group);

  // jittered grid across the tunnel's cross-section (tunnel r 26.5, disc centered on the path)
  const R = 26, STEP = 2.3;
  const base = [], dir = [], phase = [], colArr = [];
  const col = new THREE.Color();
  for (let gx = -R; gx <= R; gx += STEP) {
    for (let gy = -R; gy <= R; gy += STEP) {
      const x = gx + (Math.random() - 0.5) * 0.8;
      const y = gy + (Math.random() - 0.5) * 0.8;
      const d = Math.hypot(x, y);
      if (d > R) continue;
      base.push(x, y, 0);
      // burst: radially out of the disc plus forward along the travel direction
      const rd = d || 1;
      dir.push(x / rd + (Math.random() - 0.5) * 0.6, y / rd + (Math.random() - 0.5) * 0.6, 1 + Math.random() * 1.3);
      phase.push(Math.random() * Math.PI * 2);
      col.setHex(0xc6ff4d).multiplyScalar(0.3 + Math.random() * 0.55);
      colArr.push(col.r, col.g, col.b);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(Float32Array.from(base), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(Float32Array.from(colArr), 3));
  const mat = new THREE.PointsMaterial({
    size: 0.58, vertexColors: true, transparent: true, opacity: 0.65,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });
  group.add(new THREE.Points(geo, mat));
  return { geo, mat, base: Float32Array.from(base), dir: Float32Array.from(dir), phase, count: phase.length };
})();

/* ============================================================
   Scroll ↔ camera ↔ reveal
   ============================================================ */
let rawProgress = 0, scrollProgress = 0, smoothProgress = 0;
const forceAt = new URLSearchParams(location.search).get('at'); // testing hook: ?at=0.35
if (forceAt !== null) {
  document.getElementById('loader').style.display = 'none';
  const kill = document.createElement('style');
  kill.textContent = '* { transition: none !important; }';
  document.head.appendChild(kill);
}
const LEAD = 0.018; // how far the target may run ahead of the camera — caps cruise speed
function readScroll() {
  if (forceAt !== null) { rawProgress = scrollProgress = parseFloat(forceAt); return; }
  const max = document.documentElement.scrollHeight - innerHeight;
  const nativeP = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  rawProgress = booted
    ? Math.min(scrollProgress + LEAD, Math.max(scrollProgress - LEAD, nativeP))
    : nativeP;
}
let idleTimer;
function syncScrollbar() {
  if (forceAt !== null || !booted || performance.now() < navUntil) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  if (max > 0 && Math.abs(scrollY / max - scrollProgress) > 0.003) {
    window.scrollTo({ top: scrollProgress * max, behavior: 'auto' });
  }
}
addEventListener('scroll', () => {
  readScroll();
  clearTimeout(idleTimer);
  idleTimer = setTimeout(syncScrollbar, 220);
}, { passive: true });

/* ---------- timeline scrubbing, mp3-player style ---------- */
const monthPts = [[0, 0]];
STOPS.forEach((st, i) => monthPts.push([stopProgress(i), st.anchorMonth]));
function progressFromMonth(m) {
  for (let i = 1; i < monthPts.length; i++) {
    if (m <= monthPts[i][1]) {
      const [p0, m0] = monthPts[i - 1], [p1, m1] = monthPts[i];
      if (m1 === m0) return p0;
      return p0 + (p1 - p0) * ((m - m0) / (m1 - m0));
    }
  }
  return 1;
}
const tlPanel = document.getElementById('timeline');
const tlTrack = tlPanel.querySelector('.track');
const tlTip = document.getElementById('tl-tip');
let scrubbing = false;
function trackFrac(e) {
  const rect = tlTrack.getBoundingClientRect();
  return Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
}
function seekFromEvent(e, smooth) {
  const frac = trackFrac(e);
  const pTarget = frac > 0.985 ? 1 : progressFromMonth(frac * 12);
  navUntil = performance.now() + 1800;
  const max = document.documentElement.scrollHeight - innerHeight;
  window.scrollTo({ top: pTarget * max, behavior: smooth ? 'smooth' : 'auto' });
}
tlPanel.addEventListener('pointerdown', (e) => {
  scrubbing = true;
  tlPanel.setPointerCapture(e.pointerId);
  seekFromEvent(e, true);
});
tlPanel.addEventListener('pointermove', (e) => {
  const frac = trackFrac(e);
  tlTip.style.left = (frac * 100).toFixed(2) + '%';
  tlTip.textContent = 'M' + Math.min(12, Math.max(1, Math.ceil(frac * 12 - 0.0001)));
  tlTip.style.opacity = 1;
  if (scrubbing) seekFromEvent(e, false);
});
tlPanel.addEventListener('pointerleave', () => { tlTip.style.opacity = 0; });
addEventListener('pointerup', () => { scrubbing = false; });

function activeStop() {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < N; i++) {
    const d = Math.abs(scrollProgress - stopProgress(i));
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const clamp01 = (x) => Math.min(1, Math.max(0, x));

// scroll progress → curve parameter: at each stop the camera sits a fixed
// gap behind that stop's station; ends framing the finale, never passing it
// at each stop the camera has already threaded the gate and sits at
// reading distance in front of that stop's floating card
const READ_GAP = 0.014;
const camKeys = [[0, 0.02]];
STOPS.forEach((s, i) => camKeys.push([stopProgress(i), (i + 1) / (N + 1) + CARD_AFTER - READ_GAP]));
camKeys.push([1, N / (N + 1) + CARD_AFTER - 0.011]);
function camT(p) {
  for (let i = 1; i < camKeys.length; i++) {
    if (p <= camKeys[i][0]) {
      const [p0, t0] = camKeys[i - 1], [p1, t1] = camKeys[i];
      let f = (p - p0) / Math.max(1e-6, p1 - p0);
      // mostly linear with a hint of settle near each stop — full smoothstep
      // would brake to zero at every card, which reads as a stall mid-scroll
      f = f + (f * f * (3 - 2 * f) - f) * 0.3;
      return t0 + (t1 - t0) * f;
    }
  }
  return camKeys[camKeys.length - 1][1];
}

const hero = document.getElementById('hero');
const timelineEl = document.getElementById('timeline');
const tlFill = document.getElementById('tl-fill');
const cardV = new THREE.Vector3();
const lookTarget = new THREE.Vector3();
const lookDir = new THREE.Vector3();
const smoothLook = new THREE.Vector3();
let smoothLookReady = false;
const camPos = new THREE.Vector3();

function monthFromProgress(p) {
  // piecewise-linear through each stop's anchor month
  const pts = STOPS.map((s, i) => [stopProgress(i), s.anchorMonth]);
  pts.unshift([0, 0]);
  for (let i = 1; i < pts.length; i++) {
    if (p <= pts[i][0]) {
      const [p0, m0] = pts[i - 1], [p1, m1] = pts[i];
      return m0 + (m1 - m0) * ((p - p0) / Math.max(1e-6, p1 - p0));
    }
  }
  return 12;
}

const clock = new THREE.Clock();
let prevTime = 0;
let coinYaw = 0; // finale coin's own spin state — eases to face-on at the end
// the medal gilds as it settles: navy brand coin → polished gold.
// Real gold = full metalness + low roughness + env reflections; the gold MAP
// carries the hue, so the tint stays near-white and emissive stays low —
// glow would flatten the luster into orange plastic
const GOLD_FACE = new THREE.Color(0xfff0cc);
const GOLD_EMISS = new THREE.Color(0xffb347);
const GOLD_EDGE = new THREE.Color(0xffc356);
const NAVY_EDGE = new THREE.Color(0x1e3282);
const WHITE_C = new THREE.Color(0xffffff);
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  const dt = Math.min(0.05, time - prevTime); prevTime = time;

  // travel speed cap: a hard fling can't teleport the camera across the
  // scene — it cruises toward the scroll position at ~one milestone/second.
  // During boot the browser may restore a previous scroll position — snap
  // to it instantly instead of auto-cruising there on refresh.
  if (!booted) {
    scrollProgress = rawProgress;
    smoothProgress = rawProgress;
    stations.forEach((stn, i) => { if (stopProgress(i) <= scrollProgress + 0.02) stn.reveal = 1; });
  } else {
    // pure exponential chase of a lead-clamped target: C1-smooth at any
    // input rate, max speed ≈ LEAD × 6 per second
    scrollProgress += (rawProgress - scrollProgress) * (1 - Math.exp(-dt * 6));
  }

  const damp = 1 - Math.exp(-dt * 3.8); // ≈0.06/frame at 60fps, identical feel at any Hz
  smoothProgress += (scrollProgress - smoothProgress) * damp;
  const p = smoothProgress;

  // exit into white at the end of the tube
  const whiteMix = clamp01((p - 0.845) / 0.085);
  scene.background.copy(BG_DARK).lerp(BG_WHITE, whiteMix);
  scene.fog.color.copy(scene.background);
  // the white world is clear air — fog eases off so the finale coin keeps its true colours
  scene.fog.density = 0.0115 * (1 - 0.7 * whiteMix);
  tunnelWireMat.opacity = 0.055 * (1 - whiteMix);

  // camera along curve: piecewise map so the camera always trails the
  // active station by a viewing gap and never overshoots the finale
  const ct = camT(p);
  curve.getPointAt(ct, camPos);
  camPos.y += 5.2;
  camera.position.copy(camPos);

  // aim strictly along the direction of travel: the tangent changes slowly
  // and continuously, so zig-zags can never whip the view sideways
  curve.getTangentAt(ct, lookDir);
  lookTarget.copy(camPos).addScaledVector(lookDir, 30);
  if (!smoothLookReady) { smoothLook.copy(lookTarget); smoothLookReady = true; }
  smoothLook.lerp(lookTarget, damp);
  camera.lookAt(smoothLook);

  // progress tube reveal
  const revealT = Math.min(clamp01(ct + 0.012), ROAD_END_T);
  progGeo.setDrawRange(0, Math.floor(totalIndexCount * revealT));
  pulses.forEach((m, i) => {
    const pt = ((time * 0.05) + i / PULSES) % 1 * revealT;
    curve.getPointAt(pt, m.position);
    m.position.y += 0.1;
    const s = 0.7 + Math.sin(time * 4 + i) * 0.3;
    m.scale.setScalar(s);
  });

  // stations: sleep in the road's violet, ignite into brand colours on
  // approach, cool back down once passed
  stations.forEach((stn, i) => {
    const d = scrollProgress - stopProgress(i);
    const target = clamp01(1 - Math.max(0, -d - 0.012) * (N + 0.4) * 2.4);
    stn.reveal += (target - stn.reveal) * (1 - Math.exp(-dt * 4.4));
    const r = easeOutCubic(stn.reveal);

    const past = clamp01((scrollProgress - stopProgress(i) - 0.02) * (N + 0.4) * 2.6);
    const dim = i === N - 1 ? 1 : 1 - 0.72 * past; // fade stations behind us — but the finale never dims
    const ignite = r * dim;

    stn.mats.forEach((m) => {
      if (m.kind === 'emissive') {
        m.mat.emissive.copy(DORMANT).lerp(m.orig, ignite);
        m.mat.emissiveIntensity = m.origI * (0.3 + 0.7 * ignite);
      } else if (m.kind === 'basic') {
        m.mat.color.copy(DORMANT).lerp(m.orig, ignite);
      } else {
        m.mat.color.copy(DORMANT_SPRITE).lerp(m.orig, ignite);
      }
    });
    stn.light.intensity = 60 * (0.08 + 0.92 * ignite) * (1 + Math.sin(time * 2 + i) * 0.12);
    stn.label.material.opacity = (0.25 + 0.75 * r) * (1 - 0.85 * past) * (1 - 0.9 * whiteMix);
    stn.label.position.y = 16.4 + Math.sin(time * 1.4 + i) * 0.35;

    const ud = stn.group.userData;
    (ud.spin || []).forEach((o, k) => { o.rotation.y = time * (0.25 + k * 0.08); o.rotation.x += 0; });
    (ud.bob || []).forEach((o, k) => { o.position.y += Math.sin(time * 2 + k) * 0.35 * r; });
    (ud.orbiters || []).forEach((o) => {
      const a = o.userData.a + time * (o.userData.wheel ? 0.22 : 0.5);
      if (o.userData.wheel) {
        o.position.set(Math.cos(a) * o.userData.r, 5.2 + Math.sin(a) * o.userData.r, o.userData.z || 0);
      } else {
        o.position.set(Math.cos(a) * o.userData.r, o.userData.y + Math.sin(a * 2) * 0.4, Math.sin(a) * o.userData.r);
      }
      if (o.userData.tag) o.userData.tag.position.set(o.position.x, o.position.y + 1.4, o.position.z);
    });
  });

  // cards: fade in while growing on approach, stay while passing, fade behind
  cards3d.forEach((c) => {
    const delta = c.tCard - ct;
    let o;
    if (delta > 0.055) o = 0;
    else if (delta > 0.02) o = 1 - (delta - 0.02) / 0.035; // grow in on approach
    else if (delta > -0.006) o = 1;                         // hold; the push handles the exit
    else o = 0;
    // the camera "pushes" the card over: it tips away, leans and falls
    const push = delta < 0.005 ? clamp01((0.005 - delta) / 0.005) : 0;
    if (push > 0) o = Math.max(0, 1 - push * push);
    if (o <= 0.01) {
      c.el.style.opacity = '0';
      c.el.style.pointerEvents = 'none';
      c.el.style.visibility = 'hidden';
      return;
    }
    cardV.copy(c.worldPos).project(camera);
    if (cardV.z > 1) { c.el.style.opacity = '0'; c.el.style.visibility = 'hidden'; return; }
    const x = (cardV.x * 0.5 + 0.5) * innerWidth;
    const y = (-cardV.y * 0.5 + 0.5) * innerHeight;
    const dist = camera.position.distanceTo(c.worldPos);
    // card may never exceed ~2/3 of the viewport height or ~45% of its width
    const fit = Math.min(
      (innerHeight * 0.66) / c.el.offsetHeight,
      (innerWidth * 0.45) / c.el.offsetWidth,
      1.1
    );
    const sc = Math.min(fit, 9.8 / Math.max(0.01, dist));
    const fallY = push * push * innerHeight * 0.85; // accelerating drop
    const tip = push * 55;  // tips away from the impact
    const lean = push * 6;  // slight sideways topple
    c.el.style.visibility = 'visible';
    c.el.style.transform = `translate(-50%, -50%) translate3d(${x.toFixed(2)}px, ${(y + fallY).toFixed(2)}px, 0) perspective(900px) rotateX(${tip.toFixed(2)}deg) rotate(${lean.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    c.el.style.opacity = o.toFixed(3);
    c.el.style.pointerEvents = o > 0.6 && push === 0 ? 'auto' : 'none';
  });

  // GO LIVE barrier: membrane shimmers in place, bursts open as the camera
  // crosses it; pure function of scroll — scrolling back reseals it
  {
    const delta = GOLIVE_T - ct;
    const push = delta < 0.009 ? clamp01((0.009 - delta) / 0.007) : 0;
    const burst = easeOutCubic(push);
    const a = barrier.geo.attributes.position.array;
    for (let i = 0; i < barrier.count; i++) {
      const j = i * 3;
      const travel = burst * (9 + (barrier.phase[i] / (Math.PI * 2)) * 15);
      a[j] = barrier.base[j] + barrier.dir[j] * travel;
      a[j + 1] = barrier.base[j + 1] + barrier.dir[j + 1] * travel;
      a[j + 2] = barrier.base[j + 2] + barrier.dir[j + 2] * travel
        + Math.sin(time * 1.6 + barrier.phase[i]) * 0.5; // idle shimmer
    }
    barrier.geo.attributes.position.needsUpdate = true;
    barrier.mat.opacity = 0.65 * (1 - push * push);
  }

  // finale coin: spins freely on approach, then the spin eases out and the
  // medal settles face-on — presented, with a slow breathing wobble
  {
    const ud = stations[N - 1].group.userData;
    const s = easeOutCubic(clamp01((p - 0.93) / 0.05));
    coinYaw += 0.33 * dt * (1 - s); // spin slows as you arrive
    const dev = ((coinYaw % Math.PI) + Math.PI) % Math.PI; // distance past the nearest face-on
    const toNearest = dev < Math.PI / 2 ? -dev : Math.PI - dev; // either face works — both carry the logo
    coinYaw += toNearest * (1 - Math.exp(-dt * 5)) * s;
    ud.coin.rotation.y = coinYaw + Math.sin(time * 0.8) * 0.07 * s;
    // gild with the settle: faces tint gold (the logo relief reads as struck
    // metal), the rim glows warm — runs AFTER the station ignite loop so the
    // emissive overrides stick
    const face = ud.coinFace, edge = ud.coinEdge;
    // swap to the gold-state map under the fog wash (p .9), before the settle begins
    const wantGold = p > 0.9;
    if (ud.coinGoldTex && wantGold !== ud.coinIsGold) {
      ud.coinIsGold = wantGold;
      face.map = wantGold ? ud.coinGoldTex : ud.coinNavyTex;
      face.emissiveMap = face.map;
      face.needsUpdate = true;
    }
    face.color.copy(WHITE_C).lerp(GOLD_FACE, s);
    face.emissive.lerp(GOLD_EMISS, s);
    face.emissiveIntensity = face.emissiveIntensity * (1 - s) + 0.18 * s;
    face.metalness = 0.12 + (1.0 - 0.12) * s;
    face.roughness = 0.45 - (0.45 - 0.16) * s;
    face.envMapIntensity = 1.7 * s;
    edge.color.copy(NAVY_EDGE).lerp(GOLD_EDGE, s);
    edge.emissive.copy(GOLD_EMISS);
    edge.emissiveIntensity = 0.12 * s;
    edge.metalness = 0.85 + 0.15 * s;
    edge.roughness = 0.3 - (0.3 - 0.14) * s;
    edge.envMapIntensity = 1.7 * s;
    // appear with the settle, so they never cross the still-spinning coin's sweep
    ud.coinShadow.material.opacity = 0.8 * s * whiteMix;
    ud.coinAura.material.opacity = 0.8 * s;
    ud.coinAura.material.rotation = time * 0.12; // the iridescence slowly turns
    ud.coinAura.scale.setScalar(36 * (1 + Math.sin(time * 0.9) * 0.02)); // breathes
  }

  // slow dust drift
  dust.rotation.y = time * 0.004;

  // bloom breathes a little at the big moments
  const bigNear = Math.max(
    1 - Math.abs(scrollProgress - stopProgress(5)) * 14,
    1 - Math.abs(scrollProgress - stopProgress(N - 1)) * 14
  );
  bloom.strength = (1.05 + clamp01(bigNear) * 0.22) * (1 - 0.82 * whiteMix);

  composer.render();
}

/* ---------- UI sync ---------- */
function syncUI() {
  requestAnimationFrame(syncUI);
  readScroll();
  const ai = activeStop();

  hero.style.opacity = scrollProgress < 0.018 ? 1 : 0; // gone well before the first card
  timelineEl.classList.toggle('visible', scrollProgress >= 0.035);

  const month = monthFromProgress(scrollProgress);
  const fillPct = (month / 12 * 100).toFixed(2) + '%';
  tlFill.style.width = fillPct;
  document.getElementById('tl-knob').style.left = fillPct;
  document.getElementById('hud-month').textContent = `MONTH ${Math.min(12, Math.max(1, Math.round(month)))} OF 12`;
  document.getElementById('hud-phase').textContent = STOPS[ai].phase;
  document.body.classList.toggle('white-out', scrollProgress > 0.868);

  // closing title rises in once the medal has settled
  const finO = clamp01((scrollProgress - 0.962) / 0.03);
  const finEl = document.getElementById('finale');
  finEl.style.opacity = finO.toFixed(3);
  finEl.style.transform = `translateX(-50%) translateY(${((1 - finO) * -16).toFixed(1)}px)`;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// deep-link: open directly at a milestone, e.g. #m3, #golive, #p2m1
function applyHash() {
  const h = location.hash.replace('#', '');
  const idx = STOPS.findIndex(s => s.id === h);
  if (idx >= 0) {
    const max = document.documentElement.scrollHeight - innerHeight;
    window.scrollTo({ top: stopProgress(idx) * max, behavior: 'auto' });
    readScroll();
    scrollProgress = rawProgress; // deep links jump instantly, no cruise
    smoothProgress = scrollProgress;
    stations.forEach((stn, i) => { if (i <= idx) stn.reveal = 1; });
  }
}
addEventListener('hashchange', () => {
  const idx = STOPS.findIndex(s => s.id === location.hash.replace('#', ''));
  if (idx >= 0) scrollToStop(idx);
});

let booted = false;
setTimeout(() => { booted = true; }, 500);
readScroll();
scrollProgress = rawProgress;
smoothProgress = scrollProgress;
stations.forEach((stn, i) => { if (stopProgress(i) <= scrollProgress + 0.02) stn.reveal = 1; });
applyHash();
animate();
syncUI();
document.fonts.ready.then(() => {
  setTimeout(() => document.getElementById('loader').classList.add('done'), 300);
});
setTimeout(() => document.getElementById('loader').classList.add('done'), 2500);
</script>
